<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Área da Cliente | Sonhe.Detalhe.Realize
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background:
                linear-gradient(
                    135deg,
                    #f8f5ed,
                    #e8e5d9
                );

            color: #4c5741;

        }


        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

        }


        .circle {

            position: absolute;

            border-radius: 50%;

            opacity: .35;

        }


        .circle-one {

            width: 350px;

            height: 350px;

            background: #d6ddc8;

            top: -150px;

            left: -120px;

        }


        .circle-two {

            width: 300px;

            height: 300px;

            background: #ddd4c0;

            bottom: -120px;

            right: -100px;

        }


        .login {

            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 430px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .92
                );

            border: 1px solid #e1dccf;

            border-radius: 28px;

            padding: 45px 35px;

            text-align: center;

            box-shadow:
                0 20px 60px
                rgba(
                    63,
                    73,
                    54,
                    .15
                );

            animation:
                aparecer .8s ease;

        }


        .logo {

            width: 90px;

            height: 90px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: white;

            border: 1px solid #ddd8ca;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

        }


        /*
            QUANDO TIVER SUA LOGO:

            coloque:

            <img
                src="{{ url_for(
                    'static',
                    filename='img/logo.png'
                ) }}"
                alt="Sonhe.Detalhe.Realize"
            >

        */

        .logo span {

            font-size: 32px;

            color: #788567;

        }


        h1 {

            font-size: 30px;

            font-weight: normal;

            color: #4f5c42;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #858585;

            font-family: Arial, sans-serif;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;

        }


        .label {

            display: block;

            text-align: left;

            font-family: Arial, sans-serif;

            font-size: 12px;

            color: #777;

            margin-bottom: 8px;

        }


        .input {

            width: 100%;

            padding: 15px 18px;

            border: 1px solid #ddd8ca;

            border-radius: 14px;

            background: #faf9f5;

            color: #4c5741;

            font-size: 16px;

            outline: none;

            transition: .3s;

            margin-bottom: 15px;

        }


        .input:focus {

            border-color: #8b9877;

            box-shadow:
                0 0 0 3px
                rgba(
                    139,
                    152,
                    119,
                    .12
                );

            background: white;

        }


        .input::placeholder {

            color: #aaa;

        }


        .button {

            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    #657354,
                    #84906f
                );

            color: white;

            font-family: Arial, sans-serif;

            font-size: 14px;

            cursor: pointer;

            transition: .3s;

            margin-top: 5px;

        }


        .button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(
                    63,
                    73,
                    54,
                    .18
                );

        }


        .erro {

            background: #f7e9e7;

            color: #9b5b52;

            border: 1px solid #ecd2ce;

            padding: 12px;

            border-radius: 12px;

            font-family: Arial, sans-serif;

            font-size: 13px;

            margin-bottom: 20px;

        }


        .info {

            margin-top: 25px;

            font-family: Arial, sans-serif;

            color: #999;

            font-size: 12px;

            line-height: 1.6;

        }


        .footer {

            margin-top: 25px;

            color: #9b9b9b;

            font-family: Arial, sans-serif;

            font-size: 11px;

        }


        .footer strong {

            color: #6f7c5e;

            font-weight: normal;

        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @media (max-width: 500px) {

            .login {

                padding:
                    35px 22px;

            }


            h1 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


    <div class="background">

        <div class="circle circle-one"></div>

        <div class="circle circle-two"></div>

    </div>


    <main class="login">


        <!-- LOGO -->

        <div class="logo">

            <!--
            Futuramente coloque sua logo aqui.

            <img
                src="{{ url_for(
                    'static',
                    filename='img/logo.png'
                ) }}"
                alt="Sonhe.Detalhe.Realize"
                style="
                    width:100%;
                    height:100%;
                    object-fit:contain;
                "
            >
            -->

            <span>
                ✦
            </span>

        </div>


        <h1>
            Área da Cliente
        </h1>


        <p class="subtitle">

            Acompanhe os detalhes do seu evento
            e fique pertinho desse momento
            tão especial. 💚

        </p>


        {% if erro %}

            <div class="erro">

                {{ erro }}

            </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('cliente_login') }}"
        >


            <label
                class="label"
                for="whatsapp"
            >

                WhatsApp cadastrado

            </label>


            <input
                class="input"
                type="tel"
                id="whatsapp"
                name="whatsapp"
                placeholder="(21) 99999-9999"
                autocomplete="tel"
                required
            >


            <button
                type="submit"
                class="button"
            >

                ✨ Entrar na minha área

            </button>


        </form>


        <p class="info">

            Utilize o mesmo número de WhatsApp
            informado no formulário de orçamento.

        </p>


        <div class="footer">

            <strong>
                Sonhe.Detalhe.Realize
            </strong>

            <br>

            Cada detalhe pensado especialmente
            para você.

        </div>


    </main>


</body>

</html>
